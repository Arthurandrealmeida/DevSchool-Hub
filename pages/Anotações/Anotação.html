    <div class="main-area">

        <header class="topbar">
            <div class="logo-area">
                <img src="../../imagens/LogoDeEstudante.png" class="logo-img">
                <h1>DevSchool Hub</h1>
            </div>

            <div class="divider"></div>
        </header>

        <main class="content">
            <h1>Suas Anotações</h1>
            <p class="Texto-anotação">Organize e revise suas anotações</p>

            <div class="top-tools">
                <input type="text" class="search-bar" placeholder="Pesquisar anotações...">
                <button class="new-note-btn">Nova Anotação</button>
            </div>

            <!-- ÁREA ONDE OS CARDS SERÃO ADICIONADOS -->
            <div class="notes-area" id="notes-area"></div>
        </main>

</div>


<div class="modal" id="modal-create">
    <div class="modal-content">
        <h2>Nova Anotação</h2>

        <div class="form-field">
    <label for="titulo">Título:</label>
    <input type="text" id="titulo">
</div>

<div class="form-field">
    <label for="conteudo">Conteúdo:</label>
    <textarea id="conteudo"></textarea>
</div>



        <div class="modal-buttons">
            <button id="cancelar">Cancelar</button>
            <button id="criar">Criar</button>
        </div>
    </div>
</div>


<div class="modal" id="modal-view">
    <div class="modal-content">
        <h2 id="modal-titulo"></h2>
        <p id="modal-texto"></p>
        <button id="fechar-view">Fechar</button>
    </div>
</div>
