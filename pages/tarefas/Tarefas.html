    <div class="main-area">

            </div>

            <div class="divider"></div>
        </header>

        <main class="content">
           <div class="tarefas-container">

    <div class="tarefas-header">
        <div>
            <h1 class="titulo-tarefas">Tarefas & Lembretes</h1>
            <p class="subtitulo-tarefas">Gerencie suas atividades e prazos</p>
        </div>

        <button class="btn-nova-tarefa">
            <span>+</span> Nova Tarefa
        </button>
    </div>

    <div class="colunas-tarefas">

        <!-- COLUNA ATIVAS -->
        <section class="coluna-tarefa">
            <h2 class="titulo-coluna">Ativas</h2>

            <h2 class="titulo-coluna">Concluídas</h2>

        </section>

    </div>

</div>

<div class="modal" id="modal-create">
    <div class="modal-content">
        <h2>Nova Tarefa</h2>

        <div class="form-field">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Digite o título da tarefa...">
        </div>

        <div class="modal-buttons">
            <button id="cancelar" class="btn-cancelar">Cancelar</button>
            <button id="criar" class="btn-criar">Criar</button>
        </div>
