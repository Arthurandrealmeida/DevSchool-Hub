</head>
<body>
    <div class="layout">

        <!-- SIDEBAR MINIMALISTA -->
        <aside class="sidebar">
            <div class="logo"></div>

            <nav class="menu">
                <ul>
                    <li>
                        <a href="/index.html">
                            <img class="icon" src="/imagens/dashboard.png" alt="Dashboard">
                        </a>
                    </li>

                    <li>
                        <a href="/hiperLinks/Anotação.html">
                            <img class="icon" src="/imagens/livroIMAGEM.png" alt="Anotações">
                        </a>
                    </li>

                    <li>
                        <a href="/hiperLinks/jogos.html">
                            <img class="icon" src="/imagens/Jogos.png" alt="Jogos">

                    <li>
                        <a href="/hiperLinks/lettcode.html">
                            <img class="icon" src="/imagens/lam2.png" alt="LeetCode">

                    </li>

                    <li>
                        <a href="/hiperLinks/tarefas.html">

                        </a>

                </ul>
            </nav>
        </aside>

        <div class="main-area">
            <main class="content">
               <h1 class="tituloDoJoguin">Jogo Matematico</h1>
                    <div id="math-game" style="margin-top: 30px; text-align:center;">

    <!-- Escolher dificuldade -->
    <div class="difficulty-box">
        <button class="diff-btn" data-diff="easy">Fácil</button>
        <button class="diff-btn" data-diff="medium">Médio</button>
        <button class="diff-btn" data-diff="hard">Difícil</button>
    </div>

    <!-- Escolher operação -->
    <div class="operations-box">
        <button class="op-btn" data-op="+">+</button>
        <button class="op-btn" data-op="-">-</button>
        <button class="op-btn" data-op="*">×</button>
        <button class="op-btn" data-op="/">÷</button>
    </div>

    <h2 id="operation-title"></h2>
    <h2 id="difficulty-title"></h2>

    <div style="font-size: 2em; margin: 20px;" id="question">Escolha a operação ↑</div>

    <input id="answer" type="number" placeholder="Digite a resposta"
        style="padding:10px; font-size:1.2em; width:200px;">

    <div style="margin-top: 10px; font-size: 1.3em;">
        ⏳ <span id="timer">0</span>s
    </div>

    <h3>Pontos: <span id="score">0</span></h3>
</div>
    </div>

    <a href="javascript:history.back()" class="btn-voltar">← Voltar</a>
</body>
<script src="JSdoJOGOdaMath.js"></script>
</html>
