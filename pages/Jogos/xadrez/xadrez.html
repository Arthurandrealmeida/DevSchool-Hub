          <main class="content">

              <option value="2">2 - Prefere capturas</option>
              <option value="3">3 - Sem mate1</option>

              <option value="white">Branco</option>
            </select></label>

  <script src="JS/TabuleiroXadrez.js"></script>
  <script src="JS/bots.js"></script>

<script>
  // Liga controle UI ao engine
  const levelSelect = document.getElementById('bot-level');
  const colorSelect = document.getElementById('bot-color');
  const playBtn = document.getElementById('bot-play');
  const autoCheckbox = document.getElementById('bot-auto');
  let botThinking = false;

  playBtn.addEventListener('click', () => {
    const lvl = Number(levelSelect.value);
    const color = colorSelect.value;
    if (!window.playBot) { alert('Bots não carregados'); return; }
    botThinking = true;
    const ok = window.playBot(lvl, color);
    botThinking = false;
    if (!ok) console.log('Bot não realizou movimento (sem jogadas).');
  });

  // Auto-play: verifica o turno e faz o bot jogar quando for sua vez
  setInterval(() => {
    if (!autoCheckbox.checked) return;
    if (botThinking) return;
    const lvl = Number(levelSelect.value);
    const color = colorSelect.value;
    if (typeof turnoAtual === 'undefined') return;
    if (turnoAtual === color) {
      botThinking = true;
      setTimeout(() => {
        window.playBot(lvl, color);
        botThinking = false;
      }, 120);
    }
  }, 700);
</script>
