          <main class="content">
            <h1>Xadrez devSchool</h1>
            <div id="controls" class="controls" style="margin-bottom:12px; display:none;">
              <label>Nível: <select id="bot-level">
              <option value="1">1 - Aleatório</option>
              <option value="2">2 - Prefere capturas</option>
              <option value="3">3 - Sem mate1</option>
              <option value="4">4 - Avaliação 1-ply</option>
              <option value="5">5 - Minimax depth 2</option>
              <option value="6">6 - Minimax + mobilidade</option>
            </select></label>

            <label style="margin-left:12px;">Cor do bot: <select id="bot-color">
              <option value="black">Preto</option>
              <option value="white">Branco</option>
            </select></label>
            <div id="bot-buttons" style="display:inline-block; margin-left:12px;">
              <button id="bot-play">Bot Jogar</button>
              <label style="margin-left:8px;"><input type="checkbox" id="bot-auto"> Auto-play</label>
            </div>
          </div>

          <div id="board" class="tabuleiro">
          </div>
    </main>

  <script src="JS/TabuleiroXadrez.js"></script>
  <script src="JS/bots.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('mode-modal');
  const compBtn = document.getElementById('mode-computer');
  const p1Btn = document.getElementById('mode-1v1');
  const controls = document.getElementById('controls');
  const botButtons = document.getElementById('bot-buttons');
  const autoCheckbox = document.getElementById('bot-auto');

  // mostrar modal na entrada
  modal.style.display = 'flex';

  compBtn.addEventListener('click', () => {
    // modo contra computador: mostrar controles, esconder botões e ativar auto-play
    window.gameMode = 'computer';
    // exibe controles
    if (controls) controls.style.display = 'flex';
    // esconde botões de controle manual (bot-play/auto) já que auto-play ficará ativo
    if (botButtons) botButtons.style.display = 'none';
    if (autoCheckbox) autoCheckbox.checked = true;
    // define playerColor com base na cor selecionada para o bot (jogador = cor oposta)
    const botColorSelect = document.getElementById('bot-color');
    if (botColorSelect) {
      const botColor = botColorSelect.value;
      window.playerColor = (botColor === 'white') ? 'black' : 'white';
    }
    modal.style.display = 'none';
  });

  p1Btn.addEventListener('click', () => {
    // modo 1v1: manter controles escondidos e limpar flags de modo/cores
    window.gameMode = '1v1';
    window.playerColor = null;
    if (controls) controls.style.display = 'none';
    modal.style.display = 'none';
  });
  
  // atualiza playerColor sempre que o usuário muda a cor do bot
  const botColorSelect = document.getElementById('bot-color');
  if (botColorSelect) {
    botColorSelect.addEventListener('change', () => {
      if (window.gameMode === 'computer') {
        const botColor = botColorSelect.value;
        window.playerColor = (botColor === 'white') ? 'black' : 'white';
      }
    });
  }
});
</script>

<script>
  // Liga controle UI ao engine
  const levelSelect = document.getElementById('bot-level');
  const colorSelect = document.getElementById('bot-color');
  const playBtn = document.getElementById('bot-play');
  const autoCheckbox = document.getElementById('bot-auto');
  let botThinking = false;

  playBtn.addEventListener('click', () => {
    const lvl = Number(levelSelect.value);
    const color = colorSelect.value;
    if (!window.playBot) { alert('Bots não carregados'); return; }
    botThinking = true;
    const ok = window.playBot(lvl, color);
    botThinking = false;
    if (!ok) console.log('Bot não realizou movimento (sem jogadas).');
  });

  // Auto-play: verifica o turno e faz o bot jogar quando for sua vez

    if (!autoCheckbox.checked) return;

      botThinking = true;
      setTimeout(() => {
        window.playBot(lvl, color);
        botThinking = false;
      }, 120);
    }
  }, 700);
</script>
